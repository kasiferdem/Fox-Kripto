version: '3.8'

services:
  web-dashboard:
    build: .
    container_name: fox_kripto_dashboard
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    command: uvicorn app:app_api --host 0.0.0.0 --port 8000

  telegram-poller:
    build: .
    container_name: fox_kripto_poller
    restart: always
    env_file:
      - .env
    command: python telegram_poller.py
