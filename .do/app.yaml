name: fox-kripto-bot
region: fra
services:
- name: fox-kripto-service
  github:
    branch: main
    deploy_on_push: true
    repo: kasiferdem/Fox-Kripto
  dockerfile_path: Dockerfile
  http_port: 8000
  instance_count: 1
  instance_size_slug: basic-xxs
  envs:
  - key: OPENROUTER_API_KEY
    scope: RUN_AND_BUILD
    type: SECRET
  - key: SUPABASE_URL
    scope: RUN_AND_BUILD
    value: https://eodhhrokdmlltslqzerh.supabase.co
  - key: SUPABASE_SERVICE_ROLE_KEY
    scope: RUN_AND_BUILD
    type: SECRET
  - key: TELEGRAM_BOT_TOKEN
    scope: RUN_AND_BUILD
    type: SECRET
  - key: TELEGRAM_CHAT_ID
    scope: RUN_AND_BUILD
    type: SECRET
  - key: EXCHANGE_ID
    scope: RUN_AND_BUILD
    value: binance
  - key: EXCHANGE_TESTNET
    scope: RUN_AND_BUILD
    value: "true"
