name: Offline risk policy tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  risk-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'requests>=2.31.0' 'pydantic>=2.0.0'
      - run: python -X utf8 -m unittest discover -s tests -p test_balanced_spot.py -v
